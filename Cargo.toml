[package]
name = "mev-revert-classifier"
version = "0.8.0"
edition = "2021"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
sha2 = "0.10"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
